<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RikWorks Privacy Policies</title>
  <meta name="description" content="Privacy policies and terms for apps published by RikWorks." />
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #1a1d23;
      --muted: #5c6570;
      --accent: #0b6e4f;
      --border: #e2e6eb;
      --max: 40rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 2.5rem 1.5rem 3rem;
    }
    h1 { margin: 0 0 0.4rem; font-size: 1.75rem; }
    .lead { color: var(--muted); margin: 0 0 1.75rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
    }
    .card h2 { margin: 0 0 0.35rem; font-size: 1.15rem; }
    .card p { margin: 0 0 0.85rem; color: var(--muted); font-size: 0.95rem; }
    .links { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>RikWorks</h1>
    <p class="lead">Privacy policies and terms for apps published by RikWorks.</p>

    <div class="card">
      <h2>PASSPrep</h2>
      <p>
        Offline study app for Canadian knowledge tests
        (<code>com.rikworks.passprep</code>).
      </p>
      <div class="links">
        <a href="passprep/">Privacy Policy</a>
        <a href="passprep/terms.html">Terms of Use</a>
      </div>
    </div>
  </main>

  <footer>
    Contact:
    <a href="mailto:hello.rikworks@gmail.com">hello.rikworks@gmail.com</a>
  </footer>
</body>
</html>
